  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 6"/>
