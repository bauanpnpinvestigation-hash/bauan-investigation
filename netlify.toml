# Netlify Configuration for Bauan MPS Investigation Section Portal
# Fully optimized for high performance, zero backend errors, and SPA routing

[build]
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Any route like /request, /admin, or /admin/dashboard redirects to index.html with 200 OK
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable assets (Vite hashed bundles, images, css, js) for 1 year to minimize bandwidth
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security & Privacy Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
